name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            command: cmd /c build_windows.bat
            artifact: TomatoNovelToolkit-windows
            path: |
              dist/TomatoNovelToolkit.exe
              启动桌面版.bat
          - os: macos-latest
            command: sh build_unix.sh
            artifact: TomatoNovelToolkit-macos-arm64
            path: |
              dist/TomatoNovelToolkit
              启动桌面版.command
          - os: macos-13
            command: sh build_unix.sh
            artifact: TomatoNovelToolkit-macos-intel
            path: |
              dist/TomatoNovelToolkit
              启动桌面版.command
          - os: ubuntu-latest
            command: sh build_unix.sh
            artifact: TomatoNovelToolkit-linux
            path: |
              dist/TomatoNovelToolkit
              启动桌面版.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
